[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sa-python-dsl"
version = "0.1.0"
description = "Typed Python authoring DSL for Service Architect graphs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sergey Alexeev", email = "sergeyalexeev@yahoo.com" },
]
dependencies = [
    "mcp==2.1.1",
    "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://gorundebug.com/"
Repository = "https://github.com/gorundebug/sa-python-dsl"
Documentation = "https://gorundebug.com/help/python-dsl-api"

[project.scripts]
sa-dsl = "sa_dsl.cli:main"
sa-dsl-mcp = "sa_dsl.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_dsl"]
