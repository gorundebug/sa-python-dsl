[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sa-python-dsl"
version = "0.1.0"
description = "Typed Python authoring DSL for Service Architect graphs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sergey Alexeev", email = "sergeyalexeev@yahoo.com" },
]
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.scripts]
sa-dsl = "sa_dsl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_dsl"]

